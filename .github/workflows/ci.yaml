# Required check: "CI". Typechecks, lints, tests and builds the app through package.json scripts,
# so it works with any bundler or test runner. See "CI contract" in CLAUDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_DIR: ${{ vars.BUILD_DIR || 'dist' }}
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: $/.github/actions/setup

      - name: Typecheck
        if: steps.setup.outputs.has-project == 'true'
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.typecheck?0:1)'; then
            .github/scripts/run-script.sh typecheck
          elif [ -f tsconfig.json ]; then
            echo "No \"typecheck\" script; running tsc --noEmit."
            case "$(.github/scripts/pm.sh)" in
              npm) npx --no-install tsc --noEmit ;;
              bun) bun x tsc --noEmit ;;
              pnpm) pnpm exec tsc --noEmit ;;
              yarn) yarn exec tsc --noEmit ;;
            esac
          else
            echo "::error::TypeScript is required: add tsconfig.json or a \"typecheck\" script."
            exit 1
          fi

      - name: Lint
        if: steps.setup.outputs.has-project == 'true'
        run: .github/scripts/run-script.sh lint

      - name: Test
        if: steps.setup.outputs.has-project == 'true'
        run: .github/scripts/run-script.sh test

      - name: Build
        if: steps.setup.outputs.has-project == 'true'
        run: |
          BASE_PATH="$(.github/scripts/base-path.sh)"
          export BASE_PATH
          .github/scripts/run-script.sh build --required
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_LABEL: ci

      - name: Check build output
        if: steps.setup.outputs.has-project == 'true'
        run: |
          BASE_PATH="$(.github/scripts/base-path.sh)"
          export BASE_PATH
          .github/scripts/check-build.sh "$BUILD_DIR"
