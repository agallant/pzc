# Dependabot version updates. Security updates (PRs for vulnerable dependencies) are a repo
# setting, turned on by .github/setup/setup-repo.sh, and need nothing here.
#
# Dependabot PRs go through the same gates as any other PR and auto-merge when they pass.
version: 2
updates:
  # Keeps the SHA-pinned actions in .github/ current (the "# vX.Y.Z" comments are updated too).
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    # Let new releases age a week before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

