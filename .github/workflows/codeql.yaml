# CodeQL code scanning for the app (JavaScript/TypeScript) and for these workflows (actions).
# Merging is gated by the ruleset's "code scanning results" rule, which blocks PRs that introduce
# high/critical security alerts or error-level alerts. That is why this file is an advanced-setup
# workflow rather than CodeQL "default setup": a workflow file travels with the template.
#
# Code scanning is free on public repositories. On a private repository without GitHub Code
# Security, set the repository variable CODE_SCANNING=off (setup-repo.sh does this) and the
# jobs skip instead of failing.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: vars.CODE_SCANNING != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fresh copy of the template has no app code yet; CodeQL errors on an empty language,
      # so the JS/TS analysis is skipped (and passes) until there is something to analyze.
      - name: Check for source files
        id: src
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" != javascript-typescript ] \
            || git ls-files -- '*.ts' '*.tsx' '*.mts' '*.cts' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.vue' '*.svelte' '*.html' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No JavaScript/TypeScript sources yet; skipping CodeQL for $LANGUAGE."
          fi

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.src.outputs.run == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/build/**'
              - '**/coverage/**'

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.src.outputs.run == 'true'
        with:
          category: /language:${{ matrix.language }}
