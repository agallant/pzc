# Builds each PR, publishes it to gh-pages under pr-preview/pr-<N>/, and comments the URL (with
# a QR code, for opening it on a phone or tablet) on the PR. Then runs Lighthouse against the
# live preview with mobile emulation. The preview is removed when the PR closes.
#
# Required check: "Lighthouse". It fails on accessibility or best-practices regressions (see
# .github/lighthouserc.json). Performance is reported but not gated: it is too noisy on shared
# CI runners to block merges on.
#
# The build runs with a read-only token; only the publish job, which runs no PR code, can write.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    name: Build preview
    # Fork PRs get a read-only token and can't publish to gh-pages.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has-project: ${{ steps.setup.outputs.has-project }}
    env:
      BUILD_DIR: ${{ vars.BUILD_DIR || 'dist' }}
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: $/.github/actions/setup
        with:
          cache: 'false'

      - name: Build
        if: steps.setup.outputs.has-project == 'true'
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_LABEL: 'PR #${{ github.event.pull_request.number }}'
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BASE_PATH="$(.github/scripts/base-path.sh "pr-preview/pr-$PR_NUMBER")"
          export BASE_PATH
          .github/scripts/run-script.sh build --required
          .github/scripts/check-build.sh "$BUILD_DIR"
          # Lets the Lighthouse job wait until Pages is serving this exact build.
          echo "$BUILD_SHA" > "$BUILD_DIR/preview-build.txt"

      - if: steps.setup.outputs.has-project == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site
          path: ${{ env.BUILD_DIR }}
          include-hidden-files: true
          retention-days: 3

  publish:
    name: Publish preview
    needs: build
    # Runs to deploy after a build with a project, and on close to remove the preview.
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.outputs.has-project == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.preview.outputs.preview-url }}
      action: ${{ steps.preview.outputs.deployment-action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site
          path: ${{ runner.temp }}/preview-site

      - id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ${{ runner.temp }}/preview-site

  lighthouse:
    name: Lighthouse
    needs: [build, publish]
    # Always runs on open PRs, so a failed build or publish fails this required check instead of
    # skipping it (GitHub counts a skipped required check as passing).
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check that the preview deployed
        id: gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          HAS_PROJECT: ${{ needs.build.outputs.has-project }}
          ACTION: ${{ needs.publish.outputs.action }}
        run: |
          if [ "$BUILD_RESULT" = skipped ]; then
            echo "::notice::No preview for PRs from forks; nothing to audit."
          elif [ "$BUILD_RESULT" = success ] && [ "$HAS_PROJECT" != true ]; then
            echo "::notice::No package.json yet; nothing to audit."
          elif [ "$BUILD_RESULT" = success ] && [ "$PUBLISH_RESULT" = success ] && [ "$ACTION" = deploy ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The preview didn't deploy (build: $BUILD_RESULT, publish: $PUBLISH_RESULT), so it can't be audited."
            exit 1
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for GitHub Pages to serve this build
        if: steps.gate.outputs.run == 'true'
        env:
          URL: ${{ needs.publish.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 60); do
            if [ "$(curl -fsSL "${URL}preview-build.txt?nocache=$RANDOM" 2>/dev/null | tr -d '[:space:]')" = "$SHA" ]; then
              echo "Pages is serving $SHA at $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages did not serve this build at $URL within 10 minutes."
          exit 1

      - if: steps.gate.outputs.run == 'true'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ needs.publish.outputs.url }}
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          # A public report link in the job summary; kept off for private repos.
          temporaryPublicStorage: ${{ !github.event.repository.private }}
